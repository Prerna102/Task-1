services:

  # PostgreSQL


  postgres:
    image: postgres:16
    container_name: ocr_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI + PaddleOCR

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: paddleocr_api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    ports:
      - "8000:8000"

    volumes:
      - ./uploads:/app/uploads

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

  # Streamlit frontend
 

  streamlit:

    build:
      context: .
      dockerfile: Dockerfile


    container_name: paddleocr_frontend


    restart: unless-stopped


    depends_on:

      - api


    environment:

      API_URL: http://api:8000


    ports:

      - "8501:8501"


    command:

      [
        "streamlit",
        "run",
        "streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]


volumes:

  postgres_data:
